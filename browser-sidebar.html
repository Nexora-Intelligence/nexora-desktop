<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Ask Nexora</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #0b1220;
        color: #e5e7eb;
        font: 13.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        border-left: 1px solid #1f2937;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid #1f2937;
        user-select: none;
      }
      header b { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
      header span { color: #6b7280; font-size: 11px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 4px; }
      .chip {
        background: #111827;
        border: 1px solid #1f2937;
        color: #cbd5e1;
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 12px;
        cursor: pointer;
      }
      .chip:hover { background: #1f2937; color: #fff; }
      #log { flex: 1; overflow-y: auto; padding: 10px 14px 4px; }
      .turn { margin-bottom: 14px; }
      .who { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; margin-bottom: 3px; }
      .body { white-space: pre-wrap; word-wrap: break-word; }
      .you .body { color: #a5b4fc; }
      .empty { color: #6b7280; padding: 24px 14px; text-align: center; font-size: 12.5px; }
      footer { border-top: 1px solid #1f2937; padding: 10px 12px; }
      textarea {
        width: 100%;
        min-height: 62px;
        resize: none;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 9px;
        color: #e5e7eb;
        font: inherit;
        padding: 9px 11px;
        outline: none;
      }
      textarea:focus { border-color: #4f46e5; }
      .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
      .hint { color: #6b7280; font-size: 11px; }
      button {
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 7px 15px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      .link { background: none; color: #9ca3af; padding: 4px 0; font-size: 11.5px; text-decoration: underline; }
      .ghost {
        background: #111827;
        border: 1px solid #1f2937;
        color: #cbd5e1;
        font-size: 12px;
        padding: 6px 11px;
        margin-right: 6px;
      }
      .ghost:hover { background: #1f2937; color: #fff; }
    </style>
  </head>
  <body>
    <header>
      <b>Ask Nexora</b>
      <span id="page">about this page</span>
    </header>
    <div class="chips">
      <button class="chip" data-ask="Summarise this page in a short paragraph, then three bullet points.">Summarise</button>
      <button class="chip" data-ask="What are the key facts, figures and dates on this page?">Key facts</button>
      <button class="chip" data-ask="Explain the text I have selected, in plain language.">Explain selection</button>
      <button class="chip" data-ask="What should I be sceptical about on this page? Note anything unsupported, promotional or missing.">Be sceptical</button>
    </div>
    <div id="log"><p class="empty">Ask anything about the page you are on. Nexora reads it for you.</p></div>
    <footer>
      <textarea id="input" placeholder="Ask about this page…"></textarea>
      <div class="row">
        <button class="link" id="open">Continue in Nexora Chat</button>
        <div>
          <button class="ghost" id="doit" title="Hand this to the agent, which can click and type on the page">Have Nexora do it</button>
          <button id="send">Ask</button>
        </div>
      </div>
    </footer>
    <script>
      const $ = (id) => document.getElementById(id);
      const log = $("log");
      let busy = false;
      let current = null;

      function turn(who, text) {
        if (log.querySelector(".empty")) log.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "turn " + (who === "You" ? "you" : "nexora");
        const label = document.createElement("div");
        label.className = "who";
        label.textContent = who;
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = text;
        wrap.append(label, body);
        log.append(wrap);
        log.scrollTop = log.scrollHeight;
        return body;
      }

      function ask(question) {
        if (busy || !question.trim()) return;
        busy = true;
        $("send").disabled = true;
        turn("You", question.trim());
        current = turn("Nexora", "…");
        current.dataset.started = "";
        window.nexoraUI.send({ action: "ask", question: question.trim() });
      }

      $("send").onclick = () => {
        ask($("input").value);
        $("input").value = "";
      };
      $("input").onkeydown = (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          $("send").click();
        }
      };
      for (const chip of document.querySelectorAll(".chip")) {
        chip.onclick = () => ask(chip.dataset.ask);
      }
      $("open").onclick = () => window.nexoraUI.send({ action: "openChat" });

      // Asking about a page and asking for something to be done to it are
      // different jobs: this one leaves the panel and hands the goal to the
      // full agent in the main window, which can click and type on the page.
      $("doit").onclick = () => {
        window.nexoraUI.send({ action: "handoff", goal: $("input").value.trim() });
        $("input").value = "";
      };

      // Deltas stream in; "done" and "error" close the turn out.
      window.nexoraUI.onAnswer((event) => {
        if (!current) return;
        if (event.type === "delta") {
          if (current.dataset.started !== "yes") {
            current.textContent = "";
            current.dataset.started = "yes";
          }
          current.textContent += event.text;
          log.scrollTop = log.scrollHeight;
          return;
        }
        if (event.type === "error") current.textContent = event.text || "Something went wrong.";
        else if (current.dataset.started !== "yes") current.textContent = "No answer came back.";
        busy = false;
        current = null;
        $("send").disabled = false;
      });

      // The page's right-click menu asks through here, so the question and the
      // answer land in this thread like any other.
      window.nexoraUI.onCommand((command) => {
        if (command.name === "ask") ask(String(command.question || ""));
      });

      window.nexoraUI.onState((state) => {
        try {
          $("page").textContent = state.url ? new URL(state.url).host : "about this page";
        } catch {
          $("page").textContent = "about this page";
        }
      });
    </script>
  </body>
</html>
