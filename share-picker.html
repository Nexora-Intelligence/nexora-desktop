<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Share your screen</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #0b1220;
        color: #e5e7eb;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
      }
      header {
        padding: 14px 18px 10px;
        border-bottom: 1px solid #1f2937;
      }
      header b {
        font-size: 13.5px;
        font-weight: 600;
      }
      header p {
        margin: 3px 0 0;
        color: #6b7280;
        font-size: 12px;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px 4px;
      }
      h2 {
        margin: 4px 0 8px;
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #6b7280;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .tile {
        border: 1px solid #1f2937;
        border-radius: 10px;
        background: #111827;
        padding: 8px;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .tile:hover {
        background: #1f2937;
      }
      .tile[aria-selected="true"] {
        border-color: #6366f1;
        background: #1f2937;
        outline: 1px solid #6366f1;
      }
      .tile img {
        width: 100%;
        height: 108px;
        object-fit: contain;
        border-radius: 6px;
        background: #000;
      }
      .tile span {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        color: #6b7280;
        text-align: center;
        padding: 40px 20px;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 11px 18px;
        border-top: 1px solid #1f2937;
      }
      footer .note {
        margin-right: auto;
        color: #6b7280;
        font-size: 11.5px;
      }
      button {
        font: inherit;
        padding: 6px 16px;
        border-radius: 7px;
        border: 1px solid #1f2937;
        background: #111827;
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: transparent;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Share your screen with Nexora</b>
      <p>It takes a still every few seconds while the call is running — not a recording.</p>
    </header>
    <main id="main"></main>
    <footer>
      <span class="note">Double-click to share straight away.</span>
      <button id="cancel">Cancel</button>
      <button id="share" class="primary" disabled>Share</button>
    </footer>

    <script>
      const main = document.getElementById("main");
      const shareButton = document.getElementById("share");
      let chosen = null;

      const select = (id, tile) => {
        chosen = id;
        for (const other of main.querySelectorAll(".tile")) other.setAttribute("aria-selected", "false");
        tile.setAttribute("aria-selected", "true");
        shareButton.disabled = false;
      };

      const share = () => {
        if (chosen) window.nexoraShare.pick(chosen);
      };

      function group(title, sources) {
        if (!sources.length) return;
        const heading = document.createElement("h2");
        heading.textContent = title;
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const source of sources) {
          const tile = document.createElement("button");
          tile.className = "tile";
          tile.setAttribute("aria-selected", "false");
          const image = document.createElement("img");
          image.src = source.thumbnail;
          image.alt = "";
          const label = document.createElement("span");
          label.textContent = source.name;
          label.title = source.name;
          tile.append(image, label);
          tile.addEventListener("click", () => select(source.id, tile));
          tile.addEventListener("dblclick", () => {
            select(source.id, tile);
            share();
          });
          grid.append(tile);
        }
        main.append(heading, grid);
      }

      document.getElementById("cancel").addEventListener("click", () => window.nexoraShare.cancel());
      shareButton.addEventListener("click", share);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") window.nexoraShare.cancel();
        if (event.key === "Enter") share();
      });

      window.nexoraShare.sources().then((sources) => {
        if (!sources.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent =
            "Nothing to share. macOS needs Screen Recording for Nexora Desktop in System Settings → Privacy & Security.";
          main.append(empty);
          return;
        }
        group("Screens", sources.filter((source) => source.kind === "screen"));
        group("Windows", sources.filter((source) => source.kind === "window"));
      });
    </script>
  </body>
</html>
